<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - StockBoom</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 2rem;
        }
        .admin-container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 { margin-top: 0; display: flex; justify-content: space-between; align-items: center; }
        .logout-btn { background: #ff4757; color: #fff; border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; font-weight: 600; margin-bottom: 0.5rem; }
        input[type="text"], textarea {
            width: 100%; padding: 0.8rem; border: 1px solid #ddd; border-radius: 6px; font-family: inherit;
        }
        textarea { resize: vertical; min-height: 80px; }
        .save-btn {
            background: #00e676; color: #000; font-weight: bold; border: none; padding: 1rem 2rem; border-radius: 6px; cursor: pointer; font-size: 1rem; width: 100%;
        }
        #statusMsg { text-align: center; margin-top: 1rem; font-weight: bold; }
    </style>
</head>
<body>
    <div class="admin-container">
        <h1>Website Content Editor <button class="logout-btn" id="logoutBtn">Logout</button></h1>
        
        <form id="contentForm">
            <h3>Hero Section</h3>
            <div class="form-group">
                <label>Hero Title (HTML allowed)</label>
                <input type="text" id="heroTitle">
            </div>
            <div class="form-group">
                <label>Hero Subtitle</label>
                <textarea id="heroSubtitle"></textarea>
            </div>
            
            <h3>Lead Form Section</h3>
            <div class="form-group">
                <label>Form Title</label>
                <input type="text" id="formTitle">
            </div>
            <div class="form-group">
                <label>Form Subtitle</label>
                <input type="text" id="formSubtitle">
            </div>

            <button type="submit" class="save-btn">Save Changes</button>
            <div id="statusMsg"></div>
        </form>
    </div>

    <script>
        let contentData = {};

        async function loadContent() {
            const res = await fetch('/api/content');
            if(res.ok) {
                contentData = await res.json();
                document.getElementById('heroTitle').value = contentData.heroTitle;
                document.getElementById('heroSubtitle').value = contentData.heroSubtitle;
                document.getElementById('formTitle').value = contentData.formHeader.title;
                document.getElementById('formSubtitle').value = contentData.formHeader.subtitle;
            }
        }
        loadContent();

        document.getElementById('contentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            contentData.heroTitle = document.getElementById('heroTitle').value;
            contentData.heroSubtitle = document.getElementById('heroSubtitle').value;
            contentData.formHeader.title = document.getElementById('formTitle').value;
            contentData.formHeader.subtitle = document.getElementById('formSubtitle').value;

            const res = await fetch('/api/content', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(contentData)
            });
            const data = await res.json();
            const msgEl = document.getElementById('statusMsg');
            if(data.success) {
                msgEl.style.color = 'green';
                msgEl.innerText = 'Content successfully updated! Live site is refreshed.';
            } else {
                msgEl.style.color = 'red';
                msgEl.innerText = 'Failed to save.';
            }
            setTimeout(() => msgEl.innerText = '', 3000);
        });

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await fetch('/api/logout', { method: 'POST' });
            window.location.href = '/login.html';
        });
    </script>
</body>
</html>
